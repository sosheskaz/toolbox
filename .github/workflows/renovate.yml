name: Renovate

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
    paths:
      - renovate.json
      - mise.toml
      - .github/workflows/renovate.yml
  workflow_dispatch:

concurrency:
  group: renovate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # a run killed mid-update leaves partial branches

# Read-only. Renovate's repository init reads PRs, issues and check statuses even
# in dry-run mode; declaring any permissions key makes the token deny-by-default,
# so a bare `contents: read` fails init with platform-unknown-error. Real runs
# authenticate with the GitHub App token minted below, not this one.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14  # v4.2.3
        with:
          install_args: node npm:renovate
          cache: true

      - name: Validate renovate config
        run: renovate-config-validator renovate.json

      # Scoped to what renovate actually needs rather than inheriting the App
      # installation's blanket grants. workflows:write is what lets digest
      # pinning edit .github/workflows/**.
      - name: Create GitHub App token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: write

      # useBaseBranchConfig resolves the config file *name* from the default
      # branch, so the dry run cannot work until renovate.json exists there — a
      # bootstrap PR fails with `Error fetching config file `` from branch`.
      # Skip the dry run in that window; the validator step above still gates
      # config syntax.
      - name: Check for config on default branch
        id: default-config
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # RENOVATE_BASE_BRANCHES is github.head_ref, which for a fork PR names a
          # branch that exists only in the fork — renovate would look for it here
          # and fail.
          if [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pull request is from a fork; skipping dry run (config validation still ran)"
          elif gh api "repos/${REPO}/contents/renovate.json" --jq .name > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::renovate.json is not on the default branch yet; skipping dry run (config validation still ran)"
          fi

      # On pull requests this is a dry run against the PR branch, so config
      # changes can be previewed before merge. requireConfig=optional keeps
      # renovate from short-circuiting to disabled-no-config and exiting 0
      # having validated nothing.
      - name: Run renovate
        if: github.event_name != 'pull_request' || steps.default-config.outputs.present == 'true'
        env:
          RENOVATE_TOKEN: ${{ github.event_name == 'pull_request' && github.token || steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: ${{ github.event_name == 'pull_request' && 'optional' || 'required' }}
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' || '' }}
          RENOVATE_BASE_BRANCHES: ${{ github.event_name == 'pull_request' && format('["{0}"]', github.head_ref) || '' }}
          RENOVATE_USE_BASE_BRANCH_CONFIG: ${{ github.event_name == 'pull_request' && 'merge' || '' }}
          # Seven of the Dockerfile's images come from Docker Hub, whose anonymous
          # tag-list quota is shared across GitHub-hosted runner IPs. Fork PRs get
          # no secrets, so this is gated off there rather than sending empty creds.
          # toJSON quotes and escapes each credential: plain interpolation would
          # emit invalid JSON for a value containing a quote or backslash, which
          # renovate discards silently, falling back to the anonymous quota.
          RENOVATE_HOST_RULES: >-
            ${{ github.event_name != 'pull_request'
            && format('[{{"matchHost":"docker.io","hostType":"docker","username":{0},"password":{1}}}]',
            toJSON(secrets.DOCKER_USERNAME), toJSON(secrets.DOCKER_PASSWORD))
            || '' }}
          LOG_LEVEL: info
        run: renovate
