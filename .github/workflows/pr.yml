name: PR

on:  # yamllint disable-line rule:truthy
  pull_request:

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
        with:
          install_args: hadolint shellcheck zizmor
          cache: true

      - name: hadolint
        run: hadolint Dockerfile

      - name: shellcheck
        run: shellcheck buildermaster.sh

      - name: zizmor
        run: zizmor .github/workflows/

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        run: ./buildermaster.sh
