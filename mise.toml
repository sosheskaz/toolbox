# CI tooling only. The image's own tool versions live as ARGs in the Dockerfile.

# mise's in-process npm backend fails to resolve renovate's dependency tree;
# route npm installs through the npm CLI instead.
[settings]
npm.shell_out = true

[tools]
hadolint = "2.15.1"
shellcheck = "0.11.0"
zizmor = "1.29.0"

# renovate declares engines.node "^24.11.0"; a node major bump breaks it, so
# renovate.json pins node to major 24.
node = "24.20.0"
"npm:renovate" = "44.44.0"
